[package]
name = "llmsort-experiments"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Research instruments for llmsort: experimental verbs, the cardinald daemon, and live batteries. Never published; graduates into llmsort only after its evidence is in."

[[bin]]
name = "cardinal"
path = "src/bin/cardinal.rs"

[[bin]]
name = "cardinald"
path = "src/bin/cardinald.rs"

[[bin]]
name = "freelane"
path = "src/bin/freelane.rs"

[features]
default = ["sqlite-store"]
sqlite-store = ["llmsort/sqlite-store"]

[dependencies]
llmsort = { path = "..", default-features = false }
async-trait = "0.1"
axum = "0.8"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
fancy-regex = "0.17"
futures = "0.3"
nalgebra = "0.34"
rand = "0.8"
regex = "1"
reqwest = { version = "0.13", features = ["json", "gzip", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
statrs = "0.18"
tempfile = "3"
thiserror = "2"
tiktoken-rs = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
