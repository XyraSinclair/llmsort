[workspace]
members = ["experiments"]

[package]
name = "llmsort"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Score a list by any fuzzy attribute with an LLM judge: pairwise ratio questions fitted into consistent scores with error bars, at a known cost."
readme = "README.md"
repository = "https://github.com/XyraSinclair/llmsort"
homepage = "https://llmsorting.com"
keywords = ["llm", "ranking", "sorting", "pairwise", "reranking"]
categories = ["algorithms", "science", "command-line-utilities"]
include = [
    "/src/**",
    "/examples/*.rs",
    "/examples/*.json",
    "/docs/ALGORITHM.md",
    "/docs/LOGPROBS.md",
    "/docs/MODEL.md",
    "/docs/PROMPTS.md",
    "/docs/WORKED_EXAMPLE.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
]

# `cargo binstall llmsort` fetches the release binary instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "llmsort"
path = "src/bin/llmsort/main.rs"
required-features = ["sqlite-store"]

[features]
default = ["sqlite-store"]
sqlite-store = ["rusqlite", "fs2"]


[dependencies]
async-trait = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
fancy-regex = "0.17"
fs2 = { version = "0.4", optional = true }
futures = "0.3"
nalgebra = "0.34"
rand = "0.8"
regex = "1"
reqwest = { version = "0.13", features = ["json", "gzip", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: vendored seriate judgement records are content-addressed
# over their JSON serialization; exact float parse-roundtrip is load-bearing
# for id stability (src/seriate/record.rs json_round_trip_preserves_id).
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
statrs = "0.18"
tempfile = "3"
thiserror = "2"
tiktoken-rs = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
