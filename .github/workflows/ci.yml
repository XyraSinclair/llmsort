name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Doc tests
        run: cargo test --workspace --doc --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Publish dry-run
        run: cargo publish -p llmsort --dry-run --allow-dirty

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.88 --profile minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check on MSRV
        run: cargo +1.88 check -p llmsort --all-targets --all-features --locked
