name: Release

on:
  push:
    tags:
      - "v*"
  # Manual run = preflight: builds and packages every target, uploads nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Release notes from CHANGELOG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $version" >&2; exit 1; }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true

  rust:
    needs: create-release
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: cargo
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: cross
          - os: macos-14
            target: x86_64-apple-darwin
            build: cargo
          - os: macos-14
            target: aarch64-apple-darwin
            build: cargo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: cargo
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.build == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.build }}" == "cross" ]]; then
            cross build --release --locked --target "${{ matrix.target }}" --bin llmsort
          else
            cargo build --release --locked --target "${{ matrix.target }}" --bin llmsort
          fi

      - name: Package archive
        if: runner.os != 'Windows'
        id: package_unix
        shell: bash
        run: |
          asset="llmsort-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$asset" llmsort
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        if: runner.os != 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.package_unix.outputs.asset }}
            ${{ steps.package_unix.outputs.asset }}.sha256
          fail_on_unmatched_files: true

      - name: Package archive
        if: runner.os == 'Windows'
        id: package_windows
        shell: pwsh
        run: |
          $asset = "llmsort-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/llmsort.exe" -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $(Split-Path $asset -Leaf)" | Out-File -FilePath "$asset.sha256" -Encoding ascii
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release assets
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.package_windows.outputs.asset }}
            ${{ steps.package_windows.outputs.asset }}.sha256
          fail_on_unmatched_files: true


  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-14
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v6

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.15.0"
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # Publishes through PyPI trusted publishing once the repo variable
  # PYPI_PUBLISH is "true" (set after the publisher is registered on PyPI).
  pypi:
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
